# Workflow'un GitHub'daki 'Actions' sekmesinde görünecek adı
name: PHP Syntax Check

# Bu workflow'un ne zaman çalışacağını belirler
# 'main' dalına yapılan her 'push' işleminde tetiklenecek
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Yapılacak işleri tanımlar
jobs:
  # 'build' adında bir iş tanımlıyoruz
  build:
    # Bu işin çalışacağı sanal makineyi belirtir (en son Ubuntu versiyonu)
    runs-on: ubuntu-latest

    # İşin adımlarını listeler
    steps:
      # 1. Adım: GitHub deposundaki kodumuzu sanal makineye indirir (checkout)
      - uses: actions/checkout@v4

      # 2. Adım: PHP ortamını kurar (PHP 8.2)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # 3. Adım: Tüm PHP dosyalarını bulur ve yazım denetimi (lint) yapar
      - name: Run syntax check (lint)
        run: find . -name "*.php" -print0 | xargs -0 -n1 -P4 php -l