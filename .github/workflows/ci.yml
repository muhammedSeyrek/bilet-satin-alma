name: PHP Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: xdebug # YENİ: Raporlama için Xdebug'ı kuruyoruz

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit tests and generate coverage report
        # YENİ: Kod kapsamı raporunu 'coverage' adında bir klasöre HTML formatında oluştur
        run: vendor/bin/phpunit --coverage-html coverage

      - name: Upload Code Coverage Report
        # YENİ: 'coverage' klasörünün içeriğini bir 'artifact' olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/